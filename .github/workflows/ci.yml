name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Test & Smoke Pack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run self-checks & validations
        run: npm run check

      - name: Smoke pack (validate electron bundling)
        run: npm run pack

  version-guard:
    name: Check version bump (PR to main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version is ready for release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Checking if tag $TAG already exists on GitHub Releases..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists on GitHub! If this PR is releasing a new version to main, please bump the version in package.json, compat.json, and CHANGELOG.md."
            exit 1
          else
            echo "✅ Version $VERSION ($TAG) has not been released yet. Ready to merge and trigger release."
          fi
