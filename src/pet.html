<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Wisp</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <div id="stage" class="idle">
      <aside id="bubble" hidden>
        <p id="line"></p>
      </aside>
      <button id="ghost" type="button" aria-label="Wisp">
      <span class="halo"></span>
      <canvas id="canvas" class="hit" width="124" height="148" hidden></canvas>
      <svg viewBox="0 0 120 140" aria-hidden="true">
        <defs>
          <radialGradient id="body" cx="50%" cy="38%" r="62%">
            <stop offset="0%" stop-color="#fff6d8" />
            <stop offset="55%" stop-color="#f0d7a2" />
            <stop offset="100%" stop-color="#c9a56a" />
          </radialGradient>
          <radialGradient id="flame" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffe9a0" />
            <stop offset="70%" stop-color="#e8a54b" />
            <stop offset="100%" stop-color="#c45d2a" stop-opacity="0" />
          </radialGradient>
        </defs>
        <ellipse class="shadow" cx="60" cy="128" rx="28" ry="6" />
        <path
          class="sheet"
          d="M28 54c0-22 14-40 32-40s32 18 32 40v42c0 2-2 4-5 3-6-2-8 8-13 8s-7-10-14-10-9 10-14 10-7-10-13-8c-3 1-5-1-5-3z"
        />
        <circle class="flame" cx="60" cy="62" r="11" />
        <g class="face">
          <ellipse class="blush left" cx="38" cy="58" rx="7" ry="4" />
          <ellipse class="blush right" cx="82" cy="58" rx="7" ry="4" />
          <g class="eye left">
            <ellipse cx="44" cy="50" rx="7.5" ry="9" />
            <circle class="pupil" cx="45" cy="52" r="3.2" />
            <circle class="glint" cx="47" cy="49" r="1.2" />
          </g>
          <g class="eye right">
            <ellipse cx="76" cy="50" rx="7.5" ry="9" />
            <circle class="pupil" cx="77" cy="52" r="3.2" />
            <circle class="glint" cx="79" cy="49" r="1.2" />
          </g>
          <path class="mouth" d="M54 66c4 5 8 5 12 0" />
        </g>
      </svg>
      <span id="ping"></span>
    </button>
    </div>
    <script src="../node_modules/@rive-app/canvas/rive.js"></script>
    <script src="lib/riv.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
